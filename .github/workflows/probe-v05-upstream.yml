name: Probe archived v0.4 upstream

on:
  push:
    branches:
      - work/v0.5-update
    paths:
      - .github/workflows/probe-v05-upstream.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Query Wayback history
        shell: bash
        run: |
          set -euo pipefail
          URL='https://web.archive.org/cdx/search/cdx?url=archiveofmyth.itch.io%2Fultima-unity&from=20260820&to=20260912&output=json&fl=timestamp%2Coriginal%2Cstatuscode%2Cdigest&filter=statuscode%3A200&collapse=digest'
          curl -fsSL -A 'Mozilla/5.0' "$URL" -o cdx.json
          cat cdx.json
          python - <<'PY'
          import json, subprocess, re
          rows=json.load(open('cdx.json',encoding='utf-8'))
          for row in rows[1:]:
              ts=row[0]
              snap=f'https://web.archive.org/web/{ts}id_/https://archiveofmyth.itch.io/ultima-unity'
              p=subprocess.run(['curl','-fsSL','-A','Mozilla/5.0',snap],capture_output=True,text=True)
              if p.returncode:
                  print('ERR',ts,p.returncode)
                  continue
              html=p.stdout
              ids=[]
              for m in re.finditer(r'data-upload_id="(\d+)"',html):
                  if m.group(1) not in ids:
                      ids.append(m.group(1))
              print('SNAP',ts,'UPLOAD_IDS',ids,'BYTES',len(html.encode()))
          PY

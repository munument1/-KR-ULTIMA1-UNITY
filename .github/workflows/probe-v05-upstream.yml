name: Probe historical Ultima I Unity uploads

on:
  push:
    branches:
      - work/v0.5-update
    paths:
      - .github/workflows/probe-v05-upstream.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect historical devlog file metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, subprocess
          pages={
            '8/23':'https://archiveofmyth.itch.io/ultima-unity/devlog/1638899/new-release-and-update-to-the-game-8232026',
            '9/6':'https://archiveofmyth.itch.io/ultima-unity/devlog/1654957/new-release-and-update-to-the-game-962026',
            '9/13':'https://archiveofmyth.itch.io/ultima-unity/devlog/1663003/new-release-and-update-to-the-game-9132026',
          }
          for label,url in pages.items():
              p=subprocess.run(['curl','-fsSL','-A','Mozilla/5.0',url],capture_output=True,text=True,check=True)
              s=p.stdout
              print('\n===',label,url,'===')
              for pat in [r'upload_list_\d+', r'upload[_-]?id', r'/uploads/[^"\'<> ]+', r'upload[^"\'<> ]{0,120}', r'file[^"\'<> ]{0,120}']:
                  vals=[]
                  for m in re.finditer(pat,s,re.I):
                      v=m.group(0)
                      if v not in vals: vals.append(v)
                  print('PAT',pat,'COUNT',len(vals))
                  for v in vals[:40]: print(v)
              for wid in re.findall(r'upload_list_(\d+)',s):
                  i=s.find('upload_list_'+wid)
                  print('WIDGET_CONTEXT',wid,s[max(0,i-3000):i+6000].replace('\n',' ')[:9000])
          PY

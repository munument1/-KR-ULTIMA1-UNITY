name: Probe v0.5 upstream

on:
  push:
    branches:
      - work/v0.5-update
    paths:
      - .github/workflows/probe-v05-upstream.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect itch.io download endpoint
        shell: bash
        run: |
          set -euo pipefail
          PAGE='https://archiveofmyth.itch.io/ultima-unity'
          curl -fsSL -A 'Mozilla/5.0' "$PAGE" -o itch-page.html
          UPLOAD_ID=$(python - <<'PY'
          import re
          s=open('itch-page.html',encoding='utf-8').read()
          m=re.search(r'data-upload_id="(\d+)"[^>]*>Download</a>.*?title="Ultima I Unity\.zip"',s,re.S)
          print(m.group(1) if m else '')
          PY
          )
          echo "UPLOAD_ID=$UPLOAD_ID"
          test -n "$UPLOAD_ID"
          for u in \
            "$PAGE/file/$UPLOAD_ID" \
            "$PAGE/download/$UPLOAD_ID" \
            "https://itch.io/uploads/$UPLOAD_ID/download" \
            "https://api.itch.io/uploads/$UPLOAD_ID/download"; do
            echo "=== $u ==="
            curl -sSIL --max-redirs 5 -A 'Mozilla/5.0' "$u" | sed -n '1,30p' || true
          done
          echo '=== scripts ==='
          python - <<'PY'
          import re
          s=open('itch-page.html',encoding='utf-8').read()
          for x in re.findall(r'<script[^>]+src="([^"]+)"',s): print(x)
          PY

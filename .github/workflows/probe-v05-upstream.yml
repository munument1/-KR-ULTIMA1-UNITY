name: Probe historical Ultima I Unity uploads

on:
  push:
    branches:
      - work/v0.5-update
    paths:
      - .github/workflows/probe-v05-upstream.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect devlog pages for historical upload IDs
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://archiveofmyth.itch.io/ultima-unity'
          curl -fsSL -A 'Mozilla/5.0' "$BASE" -o main.html
          python - <<'PY'
          import re, html, subprocess
          text=open('main.html',encoding='utf-8',errors='replace').read()
          links=[]
          for href,title in re.findall(r'href="([^"]*/devlog/[^"#?]+)"[^>]*>(.*?)</a>',text,re.S|re.I):
              clean=re.sub('<[^>]+>',' ',title)
              clean=' '.join(html.unescape(clean).split())
              href=html.unescape(href)
              if href.startswith('/'):
                  href='https://archiveofmyth.itch.io'+href
              elif not href.startswith('http'):
                  href='https://archiveofmyth.itch.io/ultima-unity/'+href.lstrip('/')
              if (href,clean) not in links:
                  links.append((href,clean))
          print('DEVLOG_LINKS',len(links))
          for href,title in links:
              print('DEVLOG',repr(title),href)
              if any(x in title for x in ['8/23/2026','9/6/2026','9/13/2026']):
                  p=subprocess.run(['curl','-fsSL','-A','Mozilla/5.0',href],capture_output=True,text=True)
                  print('FETCH_RC',p.returncode,'BYTES',len(p.stdout.encode()))
                  ids=[]
                  for m in re.finditer(r'data-upload_id="(\d+)"',p.stdout):
                      if m.group(1) not in ids: ids.append(m.group(1))
                  print('UPLOAD_IDS',ids)
                  for m in re.finditer(r'.{0,500}Ultima I Unity\.zip.{0,500}',p.stdout,re.S|re.I):
                      print('ZIP_CONTEXT',m.group(0).replace('\n',' ')[:1400])
          PY

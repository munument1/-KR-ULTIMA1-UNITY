name: Probe v0.5 upstream

on:
  push:
    branches:
      - work/v0.5-update
    paths:
      - .github/workflows/probe-v05-upstream.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect itch.io download JavaScript
        shell: bash
        run: |
          set -euo pipefail
          PAGE='https://archiveofmyth.itch.io/ultima-unity'
          curl -fsSL -A 'Mozilla/5.0' "$PAGE" -o itch-page.html
          SCRIPT=$(python - <<'PY'
          import re
          s=open('itch-page.html',encoding='utf-8').read()
          xs=re.findall(r'<script[^>]+src="([^"]+)"',s)
          print(next(x for x in xs if 'game.min.js' in x))
          PY
          )
          echo "SCRIPT=$SCRIPT"
          curl -fsSL -A 'Mozilla/5.0' "$SCRIPT" -o game.min.js
          python - <<'PY'
          import re
          s=open('game.min.js',encoding='utf-8',errors='replace').read()
          print('JS_BYTES',len(s.encode()))
          for term in ['upload_id','download_btn','DownloadPopup','download_url','/file/','uploads/']:
              print('\n===',term,'===')
              hits=list(re.finditer(re.escape(term),s,re.I))
              print('COUNT',len(hits))
              for m in hits[:15]: print(s[max(0,m.start()-500):m.end()+800])
          PY
